<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Ball</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #020204;
            color: #ffffff;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 430px;
            height: 680px;
            background: #06060c;
            border: 2px solid rgba(255, 115, 0, 0.4);
            border-radius: 24px;
            box-shadow: 0 0 50px rgba(255, 115, 0, 0.15), inset 0 0 20px rgba(255,255,255,0.02);
            overflow: hidden;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 22px;
            background: radial-gradient(circle at center, #10111e 0%, #040407 100%);
        }
        #ui-layer {
            position: absolute;
            top: 25px;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            font-size: 14px;
            font-weight: 900;
            pointer-events: none;
            letter-spacing: 1.5px;
            z-index: 5;
        }
        .orange-text {
            color: #ff9f00;
            text-shadow: 0 0 15px rgba(255, 159, 0, 0.7);
        }
        .best-text {
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.7);
        }
        #fever-bar-container {
            position: absolute;
            bottom: 30px;
            left: 10%;
            width: 80%;
            height: 12px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
            z-index: 5;
        }
        #fever-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffaa00, #ff0055);
            box-shadow: 0 0 20px #ff0055;
            transition: width 0.05s linear;
        }
        #screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 6, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 30px;
            border-radius: 22px;
            z-index: 10;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.075, 0.82, 0.165, 1);
        }
        .game-title {
            font-size: 44px;
            font-weight: 900;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 3px;
            background: linear-gradient(180deg, #ffffff 40%, #a0a0b5 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.2));
        }
        .game-subtitle {
            font-size: 14px;
            font-weight: 800;
            color: #ff5500;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 6px;
            text-shadow: 0 0 10px rgba(255, 85, 0, 0.4);
            min-height: 20px;
        }
        .btn-play {
            background: linear-gradient(135deg, #ff6600 0%, #cc0033 100%);
            color: white;
            border: none;
            padding: 18px 55px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(255, 50, 0, 0.4);
            transition: 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
            margin-top: 15px;
        }
        .btn-play:hover {
            transform: scale(1.05);
            box-shadow: 0 0 40px rgba(255, 50, 0, 0.7);
        }
        .btn-play:active {
            transform: scale(0.95);
        }
        .score-info {
            color: #808095;
            font-size: 14px;
            margin-bottom: 25px;
            font-weight: 500;
            line-height: 1.6;
        }
        .score-info b {
            color: #fff;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui-layer">
            <div>SCORE <br><span id="score-val" class="orange-text">0</span></div>
            <div style="text-align: center;">LEVEL <br><span id="level-val" style="color: #fff;">1</span></div>
            <div style="text-align: right;">BEST <br><span id="highscore-val" class="best-text">0</span></div>
        </div>

        <div id="fever-bar-container">
            <div id="fever-bar"></div>
        </div>

        <canvas id="gameCanvas" width="400" height="680"></canvas>

        <div id="screen-overlay">
            <h1 class="game-title" id="status-title">STACK BALL</h1>
            <div class="game-subtitle" id="status-subtitle"></div>
            <p class="score-info" id="status-desc">Smash through glowing neon platforms.<br>Collect highly valued oranges for big scores!</p>
            <button id="action-btn" class="btn-play" onclick="handleMenuAction()">PLAY NOW</button>
        </div>
    </div>

    <script type="module">
        const TENANT_CODE = "orangeid-5W2sQze4Md"; 
        const API_KEY = "73142900d1b4453cab548dba24828144"; 

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let score = 0;
        let highScore = localStorage.getItem('stackball_pro_highscore') || 0;
        let currentLevel = 1;
        let gameActive = false;
        
        let shakeDuration = 0;
        let shakeMagnitude = 0;

        let ball = { 
            x: 200, 
            y: 130, 
            radius: 11, 
            vy: 0, 
            isSmashing: false, 
            baseBounce: -6.8,
            feverMeter: 0,
            inFeverMode: false,
            trail: []
        };
        
        let platforms = [];
        let particles = [];
        let popups = [];
        let TOTAL_PLATFORMS = 25;
        let currentPlatformIndex = 0;
        let cameraY = 0;

        const NEON_PALETTE = ["#00f0ff", "#ff007c", "#39ff14", "#bc00ff", "#ffff00", "#00ffcc", "#ff5500"];

        document.getElementById('highscore-val').innerText = highScore;

        let BedrockPassport;
        try {
            const bedrock = await import('@bedrock');
            BedrockPassport = bedrock.BedrockPassport;
        } catch(e) {
            console.warn("Baseline fallback integrated.");
        }

        window.handleMenuAction = async function() {
            const desc = document.getElementById('status-desc');
            const btn = document.getElementById('action-btn');

            desc.innerText = "Securing ecosystem connection...";
            btn.style.display = "none"; // Button is hidden here during connection

            try {
                if (BedrockPassport) {
                    const passport = new BedrockPassport({ tenantCode: TENANT_CODE });
                    await passport.authenticate();
                }
                await processGamePassSequence();
            } catch (error) {
                launchActiveSession();
            }
        }

        async function processGamePassSequence() {
            const params = new URLSearchParams(window.location.search);
            let token = params.get("pass_token") || sessionStorage.getItem("game_pass_token");

            if (!token) throw new Error("Sandbox Launch Mode");

            const response = await fetch("https://app.orangeweb3.com/api/games/passes/redeem", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json",
                    "x-api-key": API_KEY
                },
                body: JSON.stringify({ tenant_code: TENANT_CODE })
            });

            if (response.ok) {
                launchActiveSession();
            } else {
                launchActiveSession();
            }
        }

        class ScorePopup {
            constructor(x, y, text, color) {
                this.x = x; this.y = y;
                this.text = text; this.color = color;
                this.alpha = 1;
            }
            update() { this.y -= 2; this.alpha -= 0.04; }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.font = "black 16px Montserrat";
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.textAlign = "center";
                ctx.fillText(this.text, this.x, this.y);
                ctx.restore();
            }
        }

        class GeometricDebris {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.vx = (Math.random() - 0.5) * 16;
                this.vy = (Math.random() - 0.7) * 14 - 2;
                this.size = Math.random() * 7 + 3;
                this.alpha = 1; this.color = color;
                this.gravity = 0.4;
                this.rotation = Math.random() * Math.PI;
            }
            update() {
                this.x += this.vx; this.y += this.vy; this.vy += this.gravity;
                this.alpha -= 0.04; this.rotation += 0.1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
                ctx.restore();
            }
        }

        function triggerScreenShake(duration, magnitude) {
            shakeDuration = duration; shakeMagnitude = magnitude;
        }

        window.launchActiveSession = function() {
            document.getElementById('screen-overlay').style.display = 'none';
            gameActive = true;
            currentPlatformIndex = 0;
            cameraY = 0;
            particles = [];
            popups = [];
            
            ball.y = 130; ball.vy = 0; ball.feverMeter = 0;
            ball.inFeverMode = false; ball.isSmashing = false; ball.trail = [];
            
            document.getElementById('score-val').innerText = score;
            document.getElementById('level-val').innerText = currentLevel;
            document.getElementById('fever-bar').style.width = "0%";
            
            TOTAL_PLATFORMS = 25 + (currentLevel * 3);
            buildTowerGeometry();
            runGraphicsPipeline();
        }

        function buildTowerGeometry() {
            platforms = [];
            let currentHeightPointer = 300;
            let obstacleChance = Math.min(0.2 + (currentLevel * 0.02), 0.5);

            for (let i = 0; i < TOTAL_PLATFORMS; i++) {
                let segmentsList = [];
                let slicesCount = 10; 
                let layerThemeColor = NEON_PALETTE[i % NEON_PALETTE.length];
                
                for (let s = 0; s < slicesCount; s++) {
                    let typeRoll = Math.random();
                    let classDesignation = "normal";
                    
                    if (i > 2) {
                        if (typeRoll < obstacleChance && s !== 0 && s !== 5) {
                            classDesignation = "obstacle";
                        } else if (typeRoll > 0.85) {
                            classDesignation = "orange";
                        }
                    }
                    
                    segmentsList.push({
                        type: classDesignation,
                        startAngle: (s * Math.PI * 2) / slicesCount,
                        endAngle: ((s + 1) * Math.PI * 2) / slicesCount,
                        color: layerThemeColor
                    });
                }
                
                platforms.push({
                    y: currentHeightPointer,
                    rotation: Math.random() * Math.PI,
                    rotSpeed: (Math.random() > 0.5 ? 1 : -1) * (0.018 + (currentLevel * 0.001) + Math.random() * 0.004),
                    segments: segmentsList,
                    broken: false,
                    thickness: 24
                });
                currentHeightPointer += 120;
            }
        }

        window.addEventListener('mousedown', () => { if(gameActive) ball.isSmashing = true; });
        window.addEventListener('mouseup', () => { if(gameActive) ball.isSmashing = false; });
        window.addEventListener('touchstart', (e) => { if(gameActive) { ball.isSmashing = true; e.preventDefault(); } }, {passive: false});
        window.addEventListener('touchend', () => { if(gameActive) ball.isSmashing = false; });

        function shadeColor(color, amount) {
            return '#' + color.replace(/^#/, '').replace(/../g, color => ('0'+Math.min(255, Math.max(0, parseInt(color, 16) + amount)).toString(16)).substr(-2));
        }

        function runGraphicsPipeline() {
            if (!gameActive) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let idealCameraTarget = platforms[currentPlatformIndex].y - 240;
            cameraY += (idealCameraTarget - cameraY) * 0.12;

            let cShakeX = 0, cShakeY = 0;
            if (shakeDuration > 0) {
                cShakeX = (Math.random() - 0.5) * shakeMagnitude;
                cShakeY = (Math.random() - 0.5) * shakeMagnitude;
                shakeDuration--;
            }

            ctx.save();
            ctx.translate(cShakeX, -cameraY + cShakeY);

            let poleGrad = ctx.createLinearGradient(canvas.width/2 - 25, 0, canvas.width/2 + 25, 0);
            poleGrad.addColorStop(0, "#12131a");
            poleGrad.addColorStop(0.5, "#2c2e3f");
            poleGrad.addColorStop(1, "#090a0d");
            ctx.fillStyle = poleGrad;
            ctx.fillRect(canvas.width/2 - 25, cameraY - 200, 50, canvas.height + 600);

            platforms.forEach((plat) => { if (!plat.broken) plat.rotation += plat.rotSpeed; });

            for (let i = platforms.length - 1; i >= 0; i--) {
                let plat = platforms[i];
                if (plat.broken) continue;
                if (plat.y - cameraY > canvas.height + 155 || plat.y - cameraY < -155) continue;

                ctx.save();
                ctx.translate(canvas.width / 2, plat.y);
                ctx.scale(1, 0.78);

                plat.segments.forEach(seg => {
                    const pad = 0.05;
                    const start = seg.startAngle + plat.rotation + pad;
                    const end = seg.endAngle + plat.rotation - pad;
                    if (start >= end) return;

                    ctx.beginPath();
                    ctx.arc(0, plat.thickness, 76, start, end);
                    ctx.lineWidth = plat.thickness;
                    ctx.lineCap = "round";
                    ctx.strokeStyle = (seg.type === "obstacle") ? "#030305" : shadeColor(seg.color, -60);
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(0, 0, 76, start, end);
                    ctx.lineWidth = plat.thickness;
                    ctx.lineCap = "round";
                    
                    if (seg.type === "obstacle") {
                        ctx.strokeStyle = "#16171f";
                        ctx.shadowBlur = 0;
                    } else if (seg.type === "orange") {
                        ctx.strokeStyle = "#ff6600";
                        ctx.shadowColor = "#ff6600";
                        ctx.shadowBlur = 20;
                    } else {
                        ctx.strokeStyle = seg.color;
                        ctx.shadowColor = seg.color;
                        ctx.shadowBlur = 14;
                    }
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                });
                ctx.restore();
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            for (let i = popups.length - 1; i >= 0; i--) {
                popups[i].update();
                popups[i].draw();
                if (popups[i].alpha <= 0) popups.splice(i, 1);
            }

            if (ball.isSmashing) {
                ball.vy = ball.inFeverMode ? 19 : 14;
                ball.trail.push({ x: ball.x, y: ball.y });
                if (ball.trail.length > 12) ball.trail.shift();
            } else {
                ball.vy += 0.46;
                if (ball.trail.length > 0) ball.trail.shift();
            }
            ball.y += ball.vy;

            if (ball.trail.length > 0) {
                ctx.save();
                ball.trail.forEach((pos, idx) => {
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, ball.radius * (idx / ball.trail.length), 0, Math.PI * 2);
                    ctx.fillStyle = ball.inFeverMode ? `rgba(255, 0, 85, ${idx * 0.1})` : `rgba(255, 110, 0, ${idx * 0.08})`;
                    ctx.fill();
                });
                ctx.restore();
            }

            if (ball.isSmashing && !ball.inFeverMode) {
                ball.feverMeter = Math.min(100, ball.feverMeter + 1.2);
                if (ball.feverMeter >= 100) ball.inFeverMode = true;
            } else if (!ball.isSmashing && !ball.inFeverMode) {
                ball.feverMeter = Math.max(0, ball.feverMeter - 0.6);
            } else if (ball.inFeverMode) {
                ball.feverMeter -= 0.9;
                if (ball.feverMeter <= 0) ball.inFeverMode = false;
            }
            document.getElementById('fever-bar').style.width = `${ball.feverMeter}%`;

            let activeTargetRing = platforms[currentPlatformIndex];
            if (ball.y >= activeTargetRing.y - ball.radius && ball.y <= activeTargetRing.y + 15) {
                
                let targetWorldAngle = -Math.PI / 2;
                let primaryHitSegment = null;
                let normalizedRay = (targetWorldAngle % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);

                for (let seg of activeTargetRing.segments) {
                    let sAngle = ((seg.startAngle + activeTargetRing.rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                    let eAngle = ((seg.endAngle + activeTargetRing.rotation) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
                    
                    if (sAngle < eAngle) {
                        if (normalizedRay >= sAngle && normalizedRay <= eAngle) { primaryHitSegment = seg; break; }
                    } else {
                        if (normalizedRay >= sAngle || normalizedRay <= eAngle) { primaryHitSegment = seg; break; }
                    }
                }

                if (!primaryHitSegment) primaryHitSegment = activeTargetRing.segments[0];

                if (ball.isSmashing) {
                    if (primaryHitSegment.type === "obstacle" && !ball.inFeverMode) {
                        for (let k=0; k<15; k++) particles.push(new GeometricDebris(ball.x, ball.y, "#ff0033"));
                        triggerScreenShake(20, 14);
                        terminateActiveSession(false, "Unstoppable force met an absolute object.");
                    } else {
                        let colorToken = primaryHitSegment.type === "orange" ? "#ff6600" : primaryHitSegment.type === "obstacle" ? "#444" : primaryHitSegment.color;
                        
                        for (let p = 0; p < 20; p++) {
                            particles.push(new GeometricDebris(canvas.width / 2 + (Math.random() - 0.5) * 140, activeTargetRing.y, colorToken));
                        }
                        
                        if (primaryHitSegment.type === "orange") {
                            score += 50; 
                            popups.push(new ScorePopup(ball.x, ball.y - 20, "+50 ORANGE BONUS!", "#ff9f00"));
                            triggerScreenShake(14, 8);
                        } else {
                            score += 10;
                            popups.push(new ScorePopup(ball.x + (Math.random()-0.5)*40, ball.y - 20, "+10", colorToken));
                            triggerScreenShake(6, 3);
                        }
                        
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('stackball_pro_highscore', highScore);
                            document.getElementById('highscore-val').innerText = highScore;
                        }

                        activeTargetRing.broken = true;
                        currentPlatformIndex++;
                        ball.vy = 2;

                        if (currentPlatformIndex >= platforms.length) {
                            terminateActiveSession(true, "STAGE CLEAR!");
                        }
                    }
                } else {
                    ball.y = activeTargetRing.y - ball.radius;
                    ball.vy = ball.baseBounce;
                    triggerScreenShake(4, 1.5);
                }
            }

            ctx.save();
            ctx.translate(ball.x, ball.y);
            let ballGrad = ctx.createRadialGradient(-ball.radius/3, -ball.radius/3, 1, 0, 0, ball.radius);
            ballGrad.addColorStop(0, "#ffffff");
            ballGrad.addColorStop(0.4, ball.inFeverMode ? "#ff0055" : (ball.isSmashing ? "#ff9900" : "#e2e8f0"));
            ballGrad.addColorStop(1, "#50001a");
            
            ctx.beginPath();
            ctx.arc(0, 0, ball.radius, 0, Math.PI * 2);
            ctx.fillStyle = ballGrad;
            if(ball.inFeverMode || ball.isSmashing) {
                ctx.shadowBlur = ball.inFeverMode ? 30 : 15;
                ctx.shadowColor = ball.inFeverMode ? "#ff0055" : "#ffaa00";
            }
            ctx.fill();
            ctx.restore();

            ctx.restore();

            document.getElementById('score-val').innerText = score;
            requestAnimationFrame(runGraphicsPipeline);
        }

        // --- BUG FIXED HERE: Button display is reset to block so it shows up ---
        function terminateActiveSession(isWinState, outputLogMsg) {
            gameActive = false;
            const overlay = document.getElementById('screen-overlay');
            const btn = document.getElementById('action-btn');
            
            overlay.style.display = 'flex';
            btn.style.display = 'inline-block'; // This line fixes the missing button!
            
            if (isWinState) {
                document.getElementById('status-title').innerText = "STAGE CLEAR";
                document.getElementById('status-subtitle').innerText = "STACK BALL";
                document.getElementById('status-desc').innerHTML = `Superb! Level ${currentLevel} conquered.<br>Current Record: <b>${highScore}</b>`;
                btn.innerText = "NEXT STAGE";
                btn.setAttribute("onclick", "advanceToNextLevel()");
            } else {
                document.getElementById('status-title').innerText = "STACK BALL";
                document.getElementById('status-subtitle').innerText = "GAME OVER";
                document.getElementById('status-desc').innerHTML = `${outputLogMsg}<br><br>Score Achieved: <b>${score}</b><br>Your Best: <b>${highScore}</b>`;
                btn.innerText = "TRY AGAIN";
                btn.setAttribute("onclick", "restartCurrentLevel()");
            }
        }

        window.advanceToNextLevel = function() {
            currentLevel++;
            launchActiveSession();
        }

        window.restartCurrentLevel = function() {
            score = 0;
            launchActiveSession();
        }
    </script>
</body>
</html>
